# docker-compose.yml
# ───────────────────
# Orchestrates all Moodify AI services for local development.
#
# Services:
#   postgres  — persistent relational database
#   redis     — cache + Celery message broker
#   backend   — FastAPI application
#   celery    — background task worker
#   frontend  — React dev server
#
# Design decisions:
#
# 1. Named volumes (postgres_data, redis_data) — data persists across
#    `docker compose down` restarts. Use `docker compose down -v` to wipe them.
#
# 2. depends_on with healthchecks — ensures postgres and redis are actually
#    ready to accept connections before backend/celery start. Without this,
#    FastAPI would crash immediately trying to connect to a starting postgres.
#
# 3. Shared environment via env_file — all services read from .env so we
#    never hardcode secrets in this file.
#
# 4. Volume mounts for hot-reload — backend and frontend mount source code
#    so changes take effect immediately without rebuilding containers.



services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: moodify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodify
      POSTGRES_USER: moodify
      POSTGRES_PASSWORD: moodify
    ports:
      - "5432:5432"   # Exposed so you can connect with pgAdmin or psql locally
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodify -d moodify"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moodify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Exposed so you can inspect with redis-cli locally
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodify_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override localhost URLs with Docker service names.
      # Inside Docker's network, services talk to each other by service name,
      # not localhost. "postgres" resolves to the postgres container's IP.
      DATABASE_URL: postgresql+asyncpg://moodify:moodify@postgres:5432/moodify
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload (--reload in uvicorn CMD)
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodify_celery
    restart: unless-stopped
    # Override the default CMD — run Celery worker instead of uvicorn
    
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://moodify:moodify@postgres:5432/moodify
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  # Separate from the worker so we can scale workers without multiple schedulers.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodify_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://moodify:moodify@postgres:5432/moodify
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodify_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot module replacement
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Prevent node_modules from being overwritten by the host mount
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

# ── Named Volumes ───────────────────────────────────────────────────────────────
# Data persists even after containers are stopped.
volumes:
  postgres_data:
  redis_data:
