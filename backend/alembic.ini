# alembic.ini
# ────────────
# Alembic reads this file to know how to connect to the database and where
# to find migration scripts.
#
# We override `sqlalchemy.url` from the environment in alembic/env.py
# so the database URL never has to live in this file (which gets committed).

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# This is overridden in env.py via settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://moodify:moodify@localhost:5432/moodify

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
